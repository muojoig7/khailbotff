# فحص تلقائي لبوت المصنع عند كل تعديل
# لا تحتاج تفعل شيئاً: GitHub يشغّله تلقائياً بعد رفع الملفات للمستودع.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: اختبارات المصنع
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت الحزم
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: فحص الصياغة
        run: python -m compileall -q app run.py config.py tools

      - name: الاختبارات
        run: pytest -q

      - name: ملخص
        if: always()
        run: echo "انتهى الفحص — راجع السجل أعلاه"
